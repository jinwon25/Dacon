name: 코드·공개 범위 검증
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s .github/tests -v
      - run: python .github/scripts/audit_public_repository.py --history
  pitch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 투구 제구 성공 확률 예측 AI 온라인 해커톤
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '투구 제구 성공 확률 예측 AI 온라인 해커톤/requirements*.txt'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q src scripts tests
      - run: python scripts/audit_repository.py
      - run: python -m pytest -q
      - run: python -m pytest -q '../스마트 창고 출고 지연 예측 AI 경진대회/tests'
