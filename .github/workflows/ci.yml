name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-free-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Audit repository payload
        run: python scripts/audit_repository.py
      - name: Run data-free tests
        run: >-
          python -m pytest -q
          tests/test_metrics.py
          tests/test_local_scorecard.py
          tests/test_robust_local_evaluation.py
          tests/test_v16_residual.py
          tests/test_experiment_notebook.py
          tests/test_features.py
          tests/test_followup.py
          tests/test_hierarchical.py
          tests/test_recency_training.py
          tests/test_rolling_drift.py
          tests/test_residual.py
          tests/test_target_encoding_audit.py
          tests/test_top1100_features.py
          tests/test_trackman_linkage.py
          tests/test_trackman_soft_linkage.py
          tests/test_repository_audit.py
